name: Deploy Next.js to Digital Ocean

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: |
          echo "NEXT_PUBLIC_API_URL=https://api.egypt-us.com" > .env.local
          npm run build

      - name: Zip build files
        run: tar -czf deploy.tar.gz .next public package.json package-lock.json next.config.ts .env.local

      - name: Copy zip to Droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          source: "deploy.tar.gz"
          target: "/var/www/EgyptUS-Tours-Frontend"

      - name: Extract and restart PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            cd /var/www/EgyptUS-Tours-Frontend
            
            # Delete old build to prevent Next.js from serving stale cached files
            rm -rf .next
            
            # Extract the pre-built files from GitHub
            tar -xzf deploy.tar.gz
            rm deploy.tar.gz
            
            # Install only production dependencies (much faster/lighter)
            npm ci --production
            
            # Restart the server - Force recreate to ensure it uses this exact directory
            pm2 delete next-frontend || true
            pm2 start npm --name "next-frontend" -- start
