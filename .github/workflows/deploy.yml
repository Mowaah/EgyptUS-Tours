name: Deploy Next.js to Digital Ocean

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Droplet via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          command_timeout: 30m
          script: |
            # Navigate to the project directory on your Droplet
            # Change this path if you clone the repo somewhere else!
            cd /var/www/EgyptUS-Tours-Frontend
            
            # Pull latest changes from the main branch
            git pull origin main
            
            # Install dependencies
            npm install
            
            # Create/update .env.local file with the production API URL
            echo "NEXT_PUBLIC_API_URL=https://api.egypt-us.com" > .env.local
            
            # Build the Next.js frontend
            npm run build
            
            # Restart the Next.js server using PM2
            pm2 restart next-frontend || pm2 start npm --name "next-frontend" -- start
