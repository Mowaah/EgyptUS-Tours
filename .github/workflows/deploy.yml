name: Deploy Next.js to Digital Ocean

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: |
          echo "NEXT_PUBLIC_API_URL=https://api.egypt-us.com" > .env.local
          echo "NEXT_PUBLIC_GOOGLE_CLIENT_ID=896835853442-khi4n2eknq7cn5j9nrre78j1f5nb1acm.apps.googleusercontent.com" >> .env.local
          npm run build

      - name: Zip build files
        run: tar -czf deploy.tar.gz .next public package.json package-lock.json next.config.ts .env.local

      - name: Copy zip to Droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          source: "deploy.tar.gz"
          target: "/var/www/EgyptUS-Tours-Frontend"

      - name: Extract and restart PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            export TARGET_USER="egyptus_frontend"
            if [ "$(whoami)" = "root" ]; then
              chown $TARGET_USER:$TARGET_USER /var/www/EgyptUS-Tours-Frontend/deploy.tar.gz
              su - $TARGET_USER -c "cd /var/www/EgyptUS-Tours-Frontend && \
                rm -rf .next && \
                tar -xzf deploy.tar.gz && \
                rm deploy.tar.gz && \
                npm ci --production && \
                pm2 delete EgyptUS-Tours-Frontend || true && \
                pm2 start npm --name 'EgyptUS-Tours-Frontend' -- start && \
                pm2 save"
            else
              cd /var/www/EgyptUS-Tours-Frontend
              rm -rf .next
              tar -xzf deploy.tar.gz
              rm deploy.tar.gz
              npm ci --production
              pm2 delete EgyptUS-Tours-Frontend || true
              pm2 start npm --name "EgyptUS-Tours-Frontend" -- start
              pm2 save
            fi
